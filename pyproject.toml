[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
django_find_project = false
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = [
    "backend/apps/accounts",
    "backend/apps/audit_logs",
    "backend/apps/common",
    "backend/apps/patients",
    "backend/apps/nurses",
]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
